<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance Contracts</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f4f7fb;color:#172033}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b1739,#243d72)}.card{background:white;border-radius:18px;padding:32px;width:min(420px,92vw);box-shadow:0 22px 70px #0005}.brand{text-align:center}.brand .logo{width:54px;height:54px;border-radius:14px;background:#d7a04a;color:white;display:grid;place-items:center;margin:auto;font-size:28px}.field{display:grid;gap:7px;margin:16px 0}.field input,.field select,.field textarea{border:1px solid #d7deeb;padding:12px;border-radius:9px}.primary{background:#173a72;color:#fff;border:0;padding:12px 18px;border-radius:9px;cursor:pointer}.wide{width:100%}.error{color:#b42318;min-height:20px}.top{background:#122b56;color:#fff;padding:13px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:3}.top .title{margin-right:auto}.top h1{font-size:19px;margin:0}.top small{color:#c6d3e8}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{border:1px solid #ffffff2a;background:#ffffff12;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.nav .danger{background:#9f2525}.page{padding:24px;max-width:1500px;margin:auto}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.stat{background:#fff;padding:18px;border-radius:13px;border:1px solid #e4e9f1}.stat strong{font-size:27px;display:block;margin-top:8px}.tools{display:flex;gap:10px;align-items:center;margin:22px 0;flex-wrap:wrap}.tools input,.tools select{padding:10px;border:1px solid #d6ddea;border-radius:8px}.tools input{min-width:250px}.table-wrap{background:white;border:1px solid #e1e7f0;border-radius:13px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:12px 14px;border-bottom:1px solid #edf0f5;text-align:left}th{background:#f8fafc;font-size:12px;text-transform:uppercase;color:#68758b}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px}.active{background:#d8f5e5;color:#137547}.expiring_soon{background:#fff1c7;color:#946200}.expired{background:#fde0dd;color:#b42318}.iconbtn{border:0;background:#edf2f8;padding:7px 9px;border-radius:7px;cursor:pointer}.empty{text-align:center;padding:60px;color:#8b96a8}.modal{position:fixed;inset:0;background:#0a12206b;display:grid;place-items:center;z-index:10;padding:20px}.modalbox{width:min(820px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:22px}.modalhead{display:flex;align-items:center}.modalhead h2{margin-right:auto}.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid .full{grid-column:1/-1}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{padding:9px 14px;border:0;border-radius:8px}.tabs button.on{background:#173a72;color:#fff}.mini-list{display:grid;gap:8px;margin-top:18px}.mini{border:1px solid #e4e9f1;border-radius:9px;padding:11px;display:flex;justify-content:space-between;align-items:center}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-wrap:wrap}.nav{width:100%}.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}}
</style></head><body>
<section id="login" class="login"><form class="card" id="loginForm"><div class="brand"><div class="logo">🏨</div><h1 id="loginProperty">Hilton Amman</h1><p>Maintenance Contracts System</p></div><h2>Sign In</h2><label class="field">Username<input id="username" required placeholder="Enter username"></label><label class="field">Password<input id="password" required type="password" placeholder="Enter password"></label><label><input type="checkbox"> Remember me</label><p id="loginError" class="error"></p><button class="primary wide">Sign In</button></form></section>
<section id="app" class="hidden"><header class="top"><div style="font-size:25px">🏨</div><div class="title"><h1 id="propertyName">Maintenance Contracts</h1><small>Maintenance Contracts</small></div><nav class="nav"><button onclick="setView('table')">Table</button><button onclick="setView('calendar')">Calendar</button><button onclick="openSettings()">Settings</button><button onclick="document.querySelector('#importFile').click()">Import</button><button onclick="exportData()">Export</button><button class="danger" onclick="deleteAll()">🗑 Delete All</button><button onclick="openContract()">＋ Add</button></nav><span id="currentUser">admin</span><button class="iconbtn" onclick="logout()">↪</button></header>
<main class="page"><div class="stats"><div class="stat">Total<strong id="sTotal">0</strong></div><div class="stat">Active<strong id="sActive">0</strong></div><div class="stat">Expiring Soon<strong id="sSoon">0</strong></div><div class="stat">Expired<strong id="sExpired">0</strong></div><div class="stat">Total (JD)<strong id="sValue">0</strong></div></div><div class="tools"><h3 style="margin-right:auto" id="sectionTitle">Contracts by Department</h3><input id="search" placeholder="Search..." oninput="render()"><select id="status" onchange="render()"><option value="">All</option><option value="active">Active</option><option value="expiring_soon">Expiring Soon</option><option value="expired">Expired</option></select><select id="department" onchange="render()"><option value="">🏨 All Departments</option></select><button class="iconbtn" onclick="loadAll()">↻</button></div><div id="tableView" class="table-wrap"><table><thead><tr><th>Contract</th><th>Contractor</th><th>Dept</th><th>Property</th><th>End Date</th><th>Value</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">No contracts</div></div><div id="calendarView" class="hidden table-wrap"><div id="calendar" style="padding:25px"></div></div></main></section>
<input id="importFile" class="hidden" type="file" accept=".csv" onchange="importData(this.files[0])">
<div id="contractModal" class="modal hidden"><form class="modalbox" id="contractForm"><div class="modalhead"><h2 id="contractTitle">Add Contract</h2><button type="button" class="close" onclick="closeModal('contractModal')">×</button></div><input type="hidden" id="contractId"><div class="grid"><label class="field">Contract name<input id="cName" required></label><label class="field">Contractor<input id="cContractor" required></label><label class="field">Phone<input id="cPhone"></label><label class="field">Department<select id="cDept"></select></label><label class="field">Value<input id="cValue" type="number" step="0.01"></label><label class="field">Currency<select id="cCurrency"><option>JD</option><option>USD</option><option>SAR</option><option>EUR</option></select></label><label class="field">Tax %<input id="cTax" type="number" step="0.01"></label><label class="field">Property<select id="cProperty"></select></label><label class="field">Start date<input id="cStart" type="date"></label><label class="field">End date<input id="cEnd" type="date" required></label><label class="field full">Notes<textarea id="cNotes"></textarea></label></div><button class="primary wide">Save Contract</button></form></div>
<div id="settingsModal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2>Settings</h2><button class="close" onclick="closeModal('settingsModal')">×</button></div><div class="tabs"><button id="tabUsers" onclick="settingsTab('users')">Users</button><button id="tabGroups" onclick="settingsTab('groups')">Groups</button><button id="tabProperties" onclick="settingsTab('properties')">Properties</button></div><div id="settingsContent"></div></div></div>
<script>
const API='/api', departments=['Information Technology','Maintenance','Accounting','Security','Housekeeping','Front Office','Food & Beverage','Human Resources'];let token=localStorage.token||'',contracts=[],properties=[],editing=null;
const $=id=>document.getElementById(id);const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});if(r.status===401){logout();throw Error('Unauthorized')}if(!r.ok)throw Error((await r.json().catch(()=>({detail:r.statusText}))).detail);return r.json()}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{let x=await api('/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=x.token;localStorage.token=token;$('currentUser').textContent=x.user.username;showApp()}catch(err){$('loginError').textContent=err.message}};
async function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadAll()}function logout(){localStorage.removeItem('token');token='';location.reload()}
async function loadAll(){try{let [me,cs,st,ps]=await Promise.all([api('/me'),api('/contracts'),api('/stats'),api('/properties')]);contracts=cs;properties=ps;$('currentUser').textContent=me.username;let a=await api('/active-property');$('propertyName').textContent=a.name;$('sTotal').textContent=st.total;$('sActive').textContent=st.active;$('sSoon').textContent=st.expiring_soon;$('sExpired').textContent=st.expired;$('sValue').textContent=Number(st.value).toLocaleString();fillSelects();render()}catch(e){console.error(e)}}
function fillSelects(){for(let id of ['department','cDept']){let el=$(id),first=id==='department'?'<option value="">🏨 All Departments</option>':'';el.innerHTML=first+departments.map(x=>`<option>${x}</option>`).join('')} $('cProperty').innerHTML=properties.map(x=>`<option>${esc(x.name)}</option>`).join('')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.toLowerCase(),s=$('status').value,d=$('department').value,list=contracts.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!s||x.status===s)&&(!d||x.department===d));$('empty').classList.toggle('hidden',list.length>0);$('rows').innerHTML=list.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.contractor_name)}</td><td>${esc(x.department)}</td><td>${esc(x.property_name)}</td><td>${esc(x.end_date)}</td><td>${Number(x.value).toLocaleString()} ${esc(x.currency)}</td><td><span class="badge ${x.status}">${x.status.replace('_',' ')}</span></td><td><button class="iconbtn" onclick="openContract(${x.id})">✎</button> <button class="iconbtn" onclick="archiveOne(${x.id})">🗑</button></td></tr>`).join('');renderCalendar(list)}
function renderCalendar(list){$('calendar').innerHTML='<h2>Contract expiry calendar</h2>'+list.sort((a,b)=>a.end_date.localeCompare(b.end_date)).map(x=>`<div class="mini"><div><b>${esc(x.end_date)}</b> — ${esc(x.name)}</div><span class="badge ${x.status}">${x.status.replace('_',' ')}</span></div>`).join('')||'<div class="empty">No contracts</div>'}
function setView(v){$('tableView').classList.toggle('hidden',v!=='table');$('calendarView').classList.toggle('hidden',v!=='calendar');$('sectionTitle').textContent=v==='table'?'Contracts by Department':'Calendar'}function openContract(id){editing=contracts.find(x=>x.id===id)||null;$('contractTitle').textContent=editing?'Edit Contract':'Add Contract';for(let [el,key] of [['cName','name'],['cContractor','contractor_name'],['cPhone','contractor_phone'],['cDept','department'],['cValue','value'],['cCurrency','currency'],['cTax','tax_percent'],['cStart','start_date'],['cEnd','end_date'],['cProperty','property_name'],['cNotes','notes']])$(el).value=editing?.[key]||'';$('contractModal').classList.remove('hidden')}
$('contractForm').onsubmit=async e=>{e.preventDefault();let data={name:$('cName').value,contractor_name:$('cContractor').value,contractor_phone:$('cPhone').value,department:$('cDept').value,value:+$('cValue').value,currency:$('cCurrency').value,tax_percent:+$('cTax').value,start_date:$('cStart').value,end_date:$('cEnd').value,property_name:$('cProperty').value,notes:$('cNotes').value};await api('/contracts'+(editing?'/'+editing.id:''),{method:editing?'PUT':'POST',body:JSON.stringify(data)});closeModal('contractModal');await loadAll()};
async function archiveOne(id){if(confirm('Archive this contract?')){await api('/contracts/'+id,{method:'DELETE'});loadAll()}}async function deleteAll(){if(confirm('Archive ALL contracts?'))for(let c of contracts)await api('/contracts/'+c.id,{method:'DELETE'});loadAll()}function closeModal(id){$(id).classList.add('hidden')}function openSettings(){$('settingsModal').classList.remove('hidden');settingsTab('users')}
async function settingsTab(tab){for(let t of ['Users','Groups','Properties'])$('tab'+t).classList.toggle('on',t.toLowerCase()===tab);let out=$('settingsContent');if(tab==='users'){let xs=await api('/users');out.innerHTML=`<form onsubmit="addUser(event)" class="grid"><label class="field">Username<input id="uName" required></label><label class="field">Password<input id="uPass" type="password"></label><label class="field">Role<select id="uRole"><option>user</option><option>admin</option></select></label><label class="field">Property<select id="uProperty">${properties.map(p=>`<option>${esc(p.name)}</option>`)}</select></label><button class="primary full">Add user</button></form><div class="mini-list">${xs.map(x=>`<div class="mini"><b>${esc(x.username)}</b><span>${esc(x.role)} · ${esc(x.property_name)}</span></div>`).join('')}</div>`}if(tab==='groups'){let xs=await api('/groups');out.innerHTML=`<form onsubmit="addNamed(event,'groups')" class="grid"><label class="field">Group name<input id="nName" required></label><label class="field">Description<input id="nDescription"></label><button class="primary full">Add group</button></form><div class="mini-list">${xs.map(x=>`<div class="mini"><b>${esc(x.name)}</b><span>${esc(x.description)}</span></div>`).join('')}</div>`}if(tab==='properties'){out.innerHTML=`<form onsubmit="addNamed(event,'properties')" class="grid"><label class="field">Property name<input id="nName" required></label><label class="field">Logo URL<input id="nLogo"></label><button class="primary full">Add property</button></form><div class="mini-list">${properties.map(x=>`<div class="mini"><b>${esc(x.name)}</b><span>${x.active?'Active':''} <button class="iconbtn" onclick="activateProperty('${esc(x.name)}')">Set active</button></span></div>`).join('')}</div>`}}
async function addUser(e){e.preventDefault();await api('/users',{method:'POST',body:JSON.stringify({username:$('uName').value,password:$('uPass').value,role:$('uRole').value,property_name:$('uProperty').value})});settingsTab('users')}async function addNamed(e,type){e.preventDefault();await api('/'+type,{method:'POST',body:JSON.stringify({name:$('nName').value,description:$('nDescription')?.value||'',logo:$('nLogo')?.value||''})});await loadAll();settingsTab(type)}async function activateProperty(n){await api('/properties/'+encodeURIComponent(n)+'/activate',{method:'POST'});await loadAll();settingsTab('properties')}
async function exportData(){let r=await fetch(API+'/export',{headers:{Authorization:'Bearer '+token}}),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='contracts.csv';a.click();URL.revokeObjectURL(a.href)}async function importData(file){if(!file)return;let f=new FormData();f.append('file',file);await fetch(API+'/import',{method:'POST',headers:{Authorization:'Bearer '+token},body:f});loadAll()}
if(token)showApp();
</script></body></html>
